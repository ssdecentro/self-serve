<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Decentro Signup Demo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* Layout concept: two worlds, one account — the public website (Montserrat, blue gradient pills) hands off to the product dashboard (Inter, black CTAs, slate surfaces). Single light look, matching both live products. */
:root{
  color-scheme: light;
  /* Website — decentro.tech */
  --w-blue:#096EF2; --w-blue2:#0092FF; --w-teal:#32CBD1;
  --w-ink:#000000; --w-grey:#5F6872; --w-line:#C4C4C4;
  --w-tint:#EFF5FF; --w-soft:#FAFAFA; --w-bar:#F8F8F8;
  --f-web:'Montserrat', 'Segoe UI', Helvetica, Arial, sans-serif;
  /* Dashboard — live platform */
  --d-bg:#FFFFFF; --d-surf:#F1F5F9; --d-bdr:#E2E8F0; --d-fg:#1C2024;
  --d-muted:#64748B; --d-sub:#475569; --d-dark:#334155; --d-black:#000000;
  --f-dash:'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  --f-mono:'SF Mono', 'Fira Code', Menlo, Consolas, monospace;
  /* Status */
  --ok:#166534; --ok-bg:#F0FDF4; --ok-bd:#BBF7D0; --ok-dot:#16A34A;
  --warn:#92400E; --warn-bg:#FFFBEB; --warn-bd:#FDE68A; --warn-dot:#F59E0B;
  --err:#B91C1C; --err-bg:#FEF2F2; --err-bd:#FECACA;
  --info:#1E3A8A; --info-bg:#EFF6FF; --info-bd:#BFDBFE; --info-dot:#3B82F6;
  --r:10px; --r-sm:6px;
}
*,*::before,*::after{box-sizing:border-box}
html,body{background:var(--d-bg);color:var(--d-fg)}
body{font-family:var(--f-dash);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:inherit}
:focus-visible{outline:2px solid var(--w-blue);outline-offset:2px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}

/* ═════════════ WEBSITE ═════════════ */
.web{font-family:var(--f-web);color:var(--w-ink);background:#fff;min-height:100%}
.w-wrap{max-width:1200px;margin:0 auto;padding-inline:24px}
.w-nav{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:#fff;border-bottom:1px solid #EDEDED}
.w-nav .w-wrap{display:flex;align-items:center;gap:28px;min-height:76px}
.wm{display:inline-flex;flex-direction:column;line-height:1;text-decoration:none;color:var(--w-ink);background:none;border:0;padding:0}
.wm b{font-size:22px;font-weight:700;letter-spacing:.06em}
.wm b i{font-style:normal;color:var(--w-blue)}
.wm small{font-size:7.5px;font-weight:600;letter-spacing:.32em;margin-top:4px}
.w-links{display:flex;gap:26px;font-size:14px;font-weight:500;color:#333}
.w-links button{background:none;border:0;padding:6px 0;font-weight:500}
.w-links button:hover{color:var(--w-blue)}
.w-right{margin-left:auto;display:flex;gap:10px;align-items:center}
.w-btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border-radius:34px;font-family:var(--f-web);font-weight:600;white-space:nowrap;text-decoration:none;transition:transform .15s, box-shadow .15s}
.w-btn-o{border:1px solid var(--w-blue);color:var(--w-blue);background:#fff;padding:10px 22px;font-size:13px}
.w-btn-o:hover{background:var(--w-tint)}
.w-btn-t{border:0;background:none;color:#222;padding:10px 12px;font-size:13px}
.w-btn-t:hover{color:var(--w-blue)}
.w-btn-g{border:0;color:#fff;background:linear-gradient(90deg,var(--w-blue),var(--w-blue2));padding:15px 40px;font-size:16px;box-shadow:0 6px 18px rgba(9,110,242,.25)}
.w-btn-g:hover{transform:translateY(-1px);box-shadow:0 10px 24px rgba(9,110,242,.3)}
.w-btn-g.sm{padding:11px 24px;font-size:14px}
.w-btn-w{border:0;background:#fff;color:var(--w-blue);padding:14px 36px;font-size:15px}
.w-hero{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,.9fr);gap:48px;align-items:center;padding-block:72px 56px}
.w-hero h1{font-size:50px;line-height:1.15;font-weight:500;margin:0;letter-spacing:-.5px;text-wrap:balance}
.w-hero h1 .typed{color:var(--w-blue);font-weight:600;display:inline-block;min-width:4ch}
.w-hero .lead{font-size:20px;color:var(--w-grey);margin:18px 0 30px}
.w-stats{display:flex;flex-direction:column;gap:8px;margin-top:40px;font-size:17px;color:var(--w-grey)}
.w-stats b{color:var(--w-blue);font-weight:600;font-size:20px}
.w-heroart{background:var(--w-tint);border-radius:24px;padding:28px;display:flex;flex-direction:column;gap:14px}
.w-heroart .lbl{font-size:12px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--w-blue)}
.w-step{background:#fff;border-radius:16px;padding:16px 18px;display:flex;gap:14px;align-items:flex-start;box-shadow:0 2px 10px rgba(9,110,242,.06)}
.w-step .n{width:30px;height:30px;border-radius:50%;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px;color:#fff;background:linear-gradient(90deg,var(--w-blue),var(--w-blue2))}
.w-step h4{margin:0;font-size:15px;font-weight:600}
.w-step p{margin:3px 0 0;font-size:13px;color:var(--w-grey);line-height:1.55}
.w-trust{padding-block:28px;font-size:22px;text-align:center}
.w-trust b{font-weight:700}
.w-sec{padding-block:72px}
.w-sec.soft{background:var(--w-soft)}
.w-sec.tint{background:var(--w-tint)}
.w-sec h2{font-size:34px;font-weight:600;margin:0 0 10px;text-align:center;text-wrap:balance}
.w-sec .sub{font-size:17px;color:var(--w-grey);text-align:center;margin:0 auto 40px;max-width:640px}
.w-grid4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:18px}
.w-feat{background:#fff;border-radius:16px;padding:24px;text-align:center;border:1px solid #EEF1F5}
.w-feat b{display:block;font-size:26px;color:var(--w-blue);font-weight:700}
.w-feat span{font-size:14px;font-weight:600}
.w-grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:20px}
.w-launch{background:#fff;border-radius:20px;padding:28px;display:flex;flex-direction:column;gap:10px}
.w-launch .ico{width:48px;height:48px;border-radius:14px;background:var(--w-tint);display:flex;align-items:center;justify-content:center;color:var(--w-blue)}
.w-launch h3{margin:6px 0 0;font-size:20px;font-weight:600}
.w-launch p{margin:0;font-size:14px;color:var(--w-grey);line-height:1.65}
.w-prod{border:1px solid #E7ECF3;border-radius:20px;padding:26px;display:flex;flex-direction:column;gap:10px;background:#fff;transition:box-shadow .15s, transform .15s}
.w-prod:hover{box-shadow:0 12px 28px rgba(9,110,242,.1);transform:translateY(-2px)}
.w-prod h3{margin:0;font-size:19px;font-weight:600}
.w-prod p{margin:0;font-size:14px;color:var(--w-grey);line-height:1.6;flex-grow:1}
.w-prod button{align-self:flex-start;background:none;border:0;padding:0;color:var(--w-blue);font-weight:600;font-size:14px}
.w-cta{background:linear-gradient(82deg,#086EF2,var(--w-teal));border-radius:28px;color:#fff;padding:48px;display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:24px}
.w-cta h2{color:#fff;text-align:left;margin:0;font-size:30px}
.w-cta p{margin:6px 0 0;font-size:16px;opacity:.92}
.w-foot{background:#000;color:#fff;padding-block:40px calc(88px + env(safe-area-inset-bottom,0px))}
.w-foot .w-wrap{display:flex;flex-wrap:wrap;gap:20px;justify-content:space-between;align-items:center}
.w-foot .wm{color:#fff}
.w-foot nav{display:flex;gap:22px;font-size:13px;color:#C9CDD2}
.w-foot nav button{background:none;border:0;color:inherit;padding:0}

/* website auth pages */
.w-auth{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,7fr);min-height:100vh}
.w-auth-art{background:linear-gradient(160deg,var(--w-tint),#DCEBFF);padding:48px 56px;display:flex;flex-direction:column;gap:32px}
.w-auth-art h2{font-size:32px;line-height:1.25;font-weight:600;margin:40px 0 0;text-wrap:balance}
.w-auth-art h2 span{color:var(--w-blue)}
.w-auth-art ol{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:14px}
.w-auth-art li{display:flex;gap:14px;align-items:flex-start;background:#fff;border-radius:16px;padding:14px 16px}
.w-auth-art li .n{width:28px;height:28px;border-radius:50%;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:12px;border:1.5px solid var(--w-blue);color:var(--w-blue)}
.w-auth-art li.on .n{background:linear-gradient(90deg,var(--w-blue),var(--w-blue2));color:#fff;border:0}
.w-auth-art li b{display:block;font-size:14px;font-weight:600}
.w-auth-art li span{font-size:13px;color:var(--w-grey)}
.w-auth-stats{margin-top:auto;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.w-auth-stats b{display:block;font-size:22px;color:var(--w-blue);font-weight:700}
.w-auth-stats span{font-size:12px;color:var(--w-grey);font-weight:500}
.w-auth-main{display:flex;flex-direction:column;align-items:center;padding:40px 24px calc(72px + env(safe-area-inset-bottom,0px))}
.w-auth-form{width:100%;max-width:520px;display:flex;flex-direction:column;gap:18px;padding-bottom:32px}
.w-auth-top{display:flex;justify-content:space-between;align-items:center;width:100%;max-width:520px;margin-bottom:28px}
.w-auth-top .alt{font-size:13px;color:var(--w-grey);margin-left:auto;text-align:right}
.w-mlogo{visibility:hidden}
@media (max-width: 900px){ .w-mlogo{visibility:visible} }
.w-auth-top .alt button{background:none;border:0;color:var(--w-blue);font-weight:600;padding:0}
.w-h{margin:0;font-size:26px;font-weight:600;text-wrap:balance}
.w-hsub{margin:-8px 0 4px;font-size:15px;color:var(--w-grey)}
.w-row2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.w-field{display:flex;flex-direction:column;gap:8px;min-width:0}
.w-field label,.w-field .lab{font-size:15px;font-weight:500;color:#000}
.w-field label i,.w-field .lab i{color:#E11D48;font-style:normal}
.w-input{height:46px;border:1px solid var(--w-line);border-radius:45px;padding:0 22px;font-size:15px;font-weight:500;color:#333;background:#fff;width:100%;min-width:0;transition:border-color .15s, box-shadow .15s}
.w-input:focus{outline:none;border-color:var(--w-blue);box-shadow:0 0 0 3px rgba(9,110,242,.12)}
.w-input.bad{border-color:#E11D48}
.w-phone{display:flex;align-items:center;border:1px solid var(--w-line);border-radius:45px;background:#fff;overflow:hidden}
.w-phone:focus-within{border-color:var(--w-blue);box-shadow:0 0 0 3px rgba(9,110,242,.12)}
.w-phone.bad{border-color:#E11D48}
.w-phone select{border:0;background:transparent;height:44px;padding:0 6px 0 18px;font-weight:600;font-size:14px}
.w-phone input{border:0;height:44px;flex:1;min-width:0;padding:0 18px 0 6px;font-size:15px;font-weight:500;color:#333;outline:none}
.w-pass{position:relative}
.w-pass button{position:absolute;right:8px;top:7px;height:32px;padding:0 12px;border:0;background:none;color:var(--w-blue);font-weight:600;font-size:12px;font-family:var(--f-web)}
.w-err{font-size:12px;color:#BE123C;font-weight:500;margin-top:-2px}
.w-hint{font-size:12px;color:var(--w-grey)}
.w-chips{display:flex;flex-wrap:wrap;gap:8px}
.w-chip{display:inline-flex;align-items:center;gap:7px;height:38px;padding:0 16px;border-radius:34px;border:1px solid var(--w-line);background:#fff;font-family:var(--f-web);font-size:13px;font-weight:600;color:#333;transition:all .12s}
.w-chip:hover{border-color:var(--w-blue)}
.w-chip[aria-pressed="true"]{background:var(--w-blue);border-color:var(--w-blue);color:#fff}
.w-check{display:flex;gap:10px;align-items:flex-start;font-size:13px;color:var(--w-grey);line-height:1.5}
.w-check input{width:17px;height:17px;margin:1px 0 0;accent-color:var(--w-blue);flex-shrink:0}
.w-check button{background:none;border:0;padding:0;color:var(--w-blue);font-weight:600}
.w-submit{width:100%;padding:13px 20px;font-size:15px}
.w-bar{width:100%;background:var(--w-bar);text-align:center;padding:16px;font-size:14px;color:var(--w-grey);margin-top:auto}
.w-bar b{color:var(--w-blue);font-weight:600;user-select:all}
.w-or{display:flex;align-items:center;gap:12px;font-size:12px;color:var(--w-grey)}
.w-or::before,.w-or::after{content:"";flex:1;height:1px;background:#E5E7EB}
.w-sso{height:46px;border:1px solid var(--w-line);border-radius:45px;background:#fff;font-family:var(--f-web);font-weight:600;font-size:14px;display:flex;align-items:center;justify-content:center;gap:10px}
.w-sso:hover{border-color:var(--w-blue)}
.w-note{background:var(--w-tint);border-radius:16px;padding:14px 16px;font-size:13px;color:#24476F;display:flex;gap:10px;align-items:flex-start;line-height:1.55}

/* setup overlay */
.setup{position:fixed;inset:0;z-index:200;background:rgba(255,255,255,.96);display:flex;align-items:center;justify-content:center;font-family:var(--f-web)}
.setup-card{width:min(420px,calc(100% - 32px));display:flex;flex-direction:column;gap:18px}
.setup-card h2{margin:0;font-size:22px;font-weight:600}
.setup-row{display:flex;gap:12px;align-items:center;font-size:15px;color:var(--w-grey);transition:color .2s}
.setup-row .s{width:24px;height:24px;border-radius:50%;border:2px solid #D7E3F5;flex-shrink:0;display:flex;align-items:center;justify-content:center}
.setup-row.done{color:#000}
.setup-row.done .s{background:var(--w-blue);border-color:var(--w-blue)}
.setup-row.busy .s{border-color:var(--w-blue);border-top-color:transparent;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* ═════════════ DASHBOARD ═════════════ */
.dash{font-family:var(--f-dash);background:var(--d-surf);min-height:100vh;color:var(--d-fg)}
.d-top{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:var(--d-bg);border-bottom:1px solid var(--d-bdr)}
.d-top-row{min-height:60px;padding:8px 24px;display:flex;flex-wrap:wrap;align-items:center;gap:10px 18px}
.d-logo{display:flex;align-items:center;gap:9px;background:none;border:0;padding:0;color:#000}
.logo{display:block;flex-shrink:0;max-width:100%}
.wm{color:#000}
.d-logo .mk{width:28px;height:28px;background:#000;border-radius:6px;display:flex;align-items:center;justify-content:center}
.d-logo b{font-size:16px;font-weight:700;letter-spacing:-.3px}
.env{display:inline-flex;background:var(--d-surf);border:1px solid var(--d-bdr);border-radius:var(--r);padding:3px;gap:2px}
.env button{display:inline-flex;align-items:center;gap:6px;height:30px;padding:0 12px;border-radius:7px;border:0;background:none;font-size:12px;font-weight:600;color:var(--d-sub)}
.env button[aria-pressed="true"]{background:#fff;color:var(--d-fg);font-weight:700;box-shadow:0 1px 2px rgba(0,0,0,.08)}
.dot{width:7px;height:7px;border-radius:50%;display:inline-block;flex-shrink:0}
.d-search{display:flex;align-items:center;gap:8px;height:36px;padding:0 12px;background:var(--d-surf);border:1px solid var(--d-bdr);border-radius:var(--r);font-size:13px;color:var(--d-muted);flex:0 1 240px;min-width:150px}
.d-search kbd{margin-left:auto;font-size:10px;background:#fff;border:1px solid var(--d-bdr);border-radius:4px;padding:1px 5px;font-family:inherit}
.d-tr{margin-left:auto;display:flex;align-items:center;gap:10px;position:relative}
.d-tr .lnk{font-size:12px;font-weight:600;color:var(--d-sub);background:none;border:0;padding:6px}
.icon-btn{width:36px;height:36px;border:1px solid var(--d-bdr);border-radius:var(--r);background:#fff;display:inline-flex;align-items:center;justify-content:center;color:var(--d-sub);position:relative}
.icon-btn .pip{position:absolute;top:7px;right:8px;width:7px;height:7px;border-radius:50%;background:#EF4444;border:1.5px solid #fff}
.av{width:34px;height:34px;border-radius:50%;background:#000;color:#fff;font-size:11px;font-weight:700;display:inline-flex;align-items:center;justify-content:center;border:0;flex-shrink:0}
.menu{position:absolute;top:44px;right:0;width:240px;background:#fff;border:1px solid var(--d-bdr);border-radius:var(--r);box-shadow:0 12px 32px rgba(0,0,0,.1);padding:6px;z-index:40}
.menu .who{padding:10px;border-bottom:1px solid var(--d-surf);margin-bottom:4px}
.menu .who b{display:block;font-size:13px}
.menu .who span{font-size:12px;color:var(--d-muted);word-break:break-all}
.menu button{width:100%;text-align:left;background:none;border:0;padding:9px 10px;border-radius:var(--r-sm);font-size:13px;font-weight:500}
.menu button:hover{background:var(--d-surf)}
.strip{display:flex;flex-wrap:wrap;align-items:center;gap:6px 16px;padding:9px 24px;font-size:13px;border-top:1px solid}
.strip.sb{background:var(--warn-bg);border-color:var(--warn-bd);color:var(--warn)}
.strip.lv{background:var(--ok-bg);border-color:var(--ok-bd);color:var(--ok)}
.strip button{margin-left:auto;background:none;border:0;padding:0;font-weight:700;color:inherit;text-decoration:underline}
.d-body{display:grid;grid-template-columns:240px minmax(0,1fr);align-items:start}
.d-side{background:#fff;border-right:1px solid var(--d-bdr);padding:14px 10px 24px;display:flex;flex-direction:column;gap:14px;min-height:calc(100vh - 100px);position:sticky;top:100px}
.d-grp{display:flex;flex-direction:column;gap:2px}
.d-grp-l{font-size:11px;font-weight:600;color:var(--d-muted);text-transform:uppercase;letter-spacing:.07em;padding:0 12px 4px}
.nv{display:flex;align-items:center;gap:9px;height:40px;padding:0 12px;border-radius:var(--r);border:0;border-left:3px solid transparent;background:none;font-weight:500;color:var(--d-sub);text-align:left;width:100%}
.nv:hover{background:var(--d-surf);color:var(--d-fg)}
.nv[aria-current="page"]{background:var(--d-surf);border-left-color:#000;color:var(--d-fg);font-weight:600;padding-left:9px}
.nv svg{opacity:.6;flex-shrink:0}
.nv[aria-current="page"] svg{opacity:1}
.nv .bdg{margin-left:auto}
.bdg{font-size:10px;font-weight:700;border-radius:100px;padding:2px 8px;white-space:nowrap}
.b-blk{background:#000;color:#fff}
.b-ok{background:var(--ok-bg);color:var(--ok);border:1px solid var(--ok-bd)}
.b-warn{background:var(--warn-bg);color:var(--warn);border:1px solid var(--warn-bd)}
.b-info{background:#DBEAFE;color:var(--info)}
.b-grey{background:var(--d-surf);color:var(--d-sub);border:1px solid var(--d-bdr)}
.b-err{background:var(--err-bg);color:var(--err);border:1px solid var(--err-bd)}
.d-main{padding:24px 24px calc(128px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:20px;min-width:0}
.ph{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px}
.ph h1{margin:0 0 4px;font-size:24px;font-weight:700;letter-spacing:-.4px}
.ph p{margin:0;font-size:13px;color:var(--d-sub)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;height:40px;padding:0 16px;border-radius:var(--r);font-size:12px;font-weight:600;white-space:nowrap;border:1px solid transparent;transition:background .12s}
.btn.sm{height:34px;padding:0 12px}
.btn.xs{height:30px;padding:0 10px;font-size:11px;border-radius:var(--r-sm)}
.btn-p{background:#000;color:#fff;border-color:#000}
.btn-p:hover{background:#1a1a1a}

  const done = () => toast((label||'Copied') + ' to clipboard');

}

/* validation */
function validateStep(n){
  const e = {};
  if(n===1){ if(!svcs().length) e.services = 'Pick at least one service to continue.'; }
  else if(STEP_FIELDS[n]){
    STEP_FIELDS[n].forEach(k => {
      const f = FIELDS[k]; let v = String(val(k)).trim();
      if(f.req && !v){ e[k] = 'Enter the '+f.l.toLowerCase()+'.'; if(f.type==='select') e[k]='Choose an option.'; return; }
      if(v && f.v && VALID[f.v]){
        let t = v; if(f.v==='pan'||f.v==='cin'||f.v==='gstin'||f.v==='ifsc') t = v.toUpperCase().replace(/\s/g,'');
        if(f.v==='mobile') t = v.replace(/[\s-]/g,'').replace(/^(\+91|91)/,'');
        if(f.v==='acct') t = v.replace(/\s/g,'');
        if(f.v==='pct') t = v.replace('%','').trim();
        if(!VALID[f.v][0].test(t)) e[k] = VALID[f.v][1];
      }
    });
  }
  else if(n===7){ DOCS.forEach(d => { if(d.req(svcs()) && !S.kyb.docs[d.id]) e['doc_'+d.id] = 1; }); }
  else if(n===8){ if(!S.kyb.declared) e.declare = 'Tick the declaration to submit.'; }
  UI.errors = e;
  return !Object.keys(e).length;
}

function prevStepNum(n){ let m = n-1; while(m>=1 && stepSkipped(m)) m--; return Math.max(1,m); }

const AI_GENERAL = [

function aiReply(q, field, expl){
  const ql = q.toLowerCase(); const fl = (field||'').toLowerCase();
  if(!field) for(const g of AI_GENERAL) if(g.re.test(ql)) return g.a;
  const kb = AI_KB[fl] || {}; const ex = (expl||'').replace(/<[^>]+>/g,''); const f = Object.values(FIELDS).find(x=>x.l===field) || {};
  const eg = f.eg ? '`'+f.eg+'`' : '';
  if(/why|need|required|reason|purpose/.test(ql)) return kb.why || ('**'+field+'** helps us verify your business for RBI, MCA and PMLA compliance. '+ex);
  if(/where|find|get|locate|source/.test(ql)) return kb.find || ('You\'ll usually find **'+field+'** on your incorporation or government documents. '+ex);
  if(/example|sample|look/.test(ql)) return eg ? 'A valid **'+field+'** looks like '+eg+'.' : ex;
  if(/format|valid|pattern|length|digit|character/.test(ql)) return kb.fmt || (ex + (eg?' Example: '+eg:''));
  if(/optional|mandatory|skip|blank|must/.test(ql)) return '**'+field+'** is '+(f.req?'**required**.':'**optional**. Leave it blank if it doesn\'t apply.');
  for(const g of AI_GENERAL) if(g.re.test(ql)) return g.a;
  return (ex || 'Here\'s what to enter for **'+field+'**.') + (eg?' Example: '+eg+'.':'') + ' Try asking *why is this needed?* or *where do I find it?*';
}

function submitSignup(){
  const d = UI.draft; const e = {};
  if(!d.first.trim()) e.first='Enter your first name.';
  if(!d.last.trim()) e.last='Enter your last name.';
  if(!VALID.email[0].test(d.email.trim())) e.email='Enter your business email, like you@company.com.';
  else if(/@(gmail|yahoo|hotmail|outlook|icloud)\./i.test(d.email)) e.email='Use your business email, not a personal one.';
  const ph = d.phone.replace(/[\s-]/g,'');
  if(!/^[0-9]{7,12}$/.test(ph) || (d.cc==='+91' && !VALID.mobile[0].test(ph))) e.phone='Enter a valid mobile number.';
  if(!d.company.trim()) e.company='Enter your company name.';
  if(d.password.length<8 || !/[0-9]/.test(d.password)) e.password='Use at least 8 characters, including a number.';
  if(!d.products.length) e.products='Pick at least one product.';
  if(!d.terms) e.terms='Accept the terms to continue.';
  UI.signupErr = e;
  if(Object.keys(e).length){ render(true); const first = document.querySelector('.w-input.bad,.w-phone.bad,#su-terms'); if(first){ first.scrollIntoView({block:'center'}); if(first.focus) first.focus(); } return; }
  const company = d.company.trim();
  const f0 = fresh();
  S.kyb = f0.kyb; S.checklist = f0.checklist; S.tests = {}; S.invites = []; S.webhook = ''; S.agentRequested = false; S.liveKeys = null;
  S.user = { first:d.first.trim(), last:d.last.trim(), email:d.email.trim().toLowerCase(), cc:d.cc, phone:ph, company:company, password:d.password };
  S.products = d.products.slice();
  S.keys = { id: slug(company)+'_sandbox', secret: 'sbx_'+rand(28) };
  S.session = true; S.env='sandbox'; S.page='home';
  const v = S.kyb.values;
  v.services = d.products.slice(); v.co_name = company; v.contact_email = S.user.email; v.dir_name = S.user.first+' '+S.user.last; v.dir_mobile = d.cc==='+91'?ph:'';
  S.kyb.src = { services:'SU', co_name:'SU', contact_email:'SU', dir_name:'SU' }; if(v.dir_mobile) S.kyb.src.dir_mobile='SU';
  UI.draft = null; UI.showPass=false;
  // setup moment
  const ov = document.createElement('div'); ov.className='setup'; ov.setAttribute('role','status');
  const rows = ['Creating your account','Generating Sandbox API keys','Enabling '+S.products.map(p=>PRODUCTS[p].label).join(', ')];
  ov.innerHTML = '<div class="setup-card"><h2>Setting up your Sandbox</h2>'+rows.map((r,i)=>'<div class="setup-row" id="sr'+i+'"><span class="s"></span>'+esc(r)+'</div>').join('')+'</div>';
  document.body.appendChild(ov);
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches; const step = reduce ? 80 : 480;
  rows.forEach((_,i)=>{ setTimeout(()=>{ const el=$('#sr'+i); if(el) el.className='setup-row busy'; }, i*step); setTimeout(()=>{ const el=$('#sr'+i); if(el){ el.className='setup-row done'; el.querySelector('.s').innerHTML='<span style="color:#fff;display:flex">'+I.check+'</span>'; } }, i*step+step-60); });
  setTimeout(()=>{ ov.remove(); go('dash'); toast('Welcome to Decentro. Your Sandbox is ready.'); }, rows.length*step+200);
}
function submitLogin(){
  const l = UI.login;
  if(!S.user){ UI.loginErr='There\'s no account for this email yet. Create one to continue.'; return render(true); }
  if(l.email.trim().toLowerCase()!==S.user.email || l.password!==S.user.password){ UI.loginErr='That email and password don\'t match. Check both and try again.'; return render(true); }
  UI.loginErr=''; UI.login=null; UI.showPass=false; S.session=true; go('dash', { page:'home' });
  toast('Logged in as '+S.user.email);
}

/* ───────────── KYB actions ───────────── */
function setStep(n){ S.kyb.step = n; if(S.kyb.status==='not_started') S.kyb.status='in_progress'; UI.errors={}; UI.tt=null; UI.mcaMsg=null; render(); }
function stepNext(){
  const n = S.kyb.step;
  if(!validateStep(n)){ render(true); const b = document.querySelector('.fi.bad,.drop.bad,.ferr'); if(b) b.scrollIntoView({block:'center'}); toast('Fix the highlighted fields to continue'); return; }
  if(!S.kyb.done.includes(n)) S.kyb.done.push(n);
  setStep(nextStepNum(n));
}
function submitKyb(){
  if(!validateStep(8)){ render(true); return; }
  for(const n of [1,2,3,4,5,6,7]){ if(stepSkipped(n)) continue; if(!validateStep(n)){ S.kyb.step=n; render(); toast('Step '+n+' needs attention before you submit'); return; } }
  UI.errors={};
  const re = S.kyb.status==='changes';
  S.kyb.status='submitted'; S.kyb.submittedAt=today(); if(!S.kyb.appId) S.kyb.appId='KYB-2026-'+rand(4,'0123456789'); S.kyb.note='';
  if(!S.kyb.done.includes(8)) S.kyb.done.push(8);
  UI.chat.open=false; S.page='home'; render();
  toast(re ? 'Resubmitted. Compliance has been notified.' : 'Submitted. Compliance reviews in 2–5 business days.');
}
function fetchMCA(){
  const raw = String(val('cin')).toUpperCase().replace(/\s/g,'');
  S.kyb.values.cin = raw;
  if(!VALID.cin[0].test(raw)){ UI.mcaMsg = { ok:false, t:VALID.cin[1] }; return render(true); }
  const base = (S.user.company||'Company').replace(/\s+(pvt\.?|private)\s*(ltd\.?|limited)?$/i,'');
  const v = S.kyb.values;
  v.co_name = base.replace(/\b\w/g,c=>c.toUpperCase()) + (raw[0]==='L' ? ' Limited' : ' Private Limited');
  v.entity_type = raw[0]==='L' ? 'Public Limited' : 'Private Limited';
  v.incorp_date = '15/03/'+raw.slice(8,12);
  v.reg_address = '5th Floor, Prestige Tower, MG Road, Bengaluru 560001';
  ['co_name','entity_type','incorp_date','reg_address'].forEach(k=>S.kyb.src[k]='MCA');
  UI.mcaMsg = { ok:true, t:'Filled legal name, entity type, incorporation date and registered address from MCA. Check them below.' };
  UI.errors={}; render(true);
}
function fillSample(){
  const n = S.kyb.step; const u = S.user;
  const sample = {
    2:{ co_name: val('co_name') || u.company+' Private Limited', cin:'U72900KA2018PTC112233', entity_type:'Private Limited', incorp_date:'15/03/2018', reg_address:'5th Floor, Prestige Tower, MG Road, Bengaluru 560001', co_pan:'AACCA1234B', contact_email:u.email, gstin:'29AACCA1234B1ZK', biz_desc:'B2B payments platform for logistics companies. Businesses pay monthly invoices over UPI and NACH; we settle to carriers.' },
    3:{ dir_name:u.first+' '+u.last, dir_desg:'Managing Director', dir_pan:'ABCPS1234K', dir_dob:'12/04/1984', dir_address:'14, Palm Avenue, Indiranagar, Bengaluru 560038', din:'07423811', dir_mobile: val('dir_mobile') || '9876543210' },
    4:{ ubo_name:u.first+' '+u.last, ubo_pct:'62', ubo_id:'ABCPS1234K', ubo_nat:'Indian', ubo_address:'14, Palm Avenue, Indiranagar, Bengaluru 560038' },
    5:{ turnover:'₹ 18,40,00,000', networth:'₹ 16,20,00,000', bank_name:'HDFC Bank', account_no:'50100234567890', ifsc:'HDFC0001234', monthly_vol:'₹1Cr – ₹10Cr / month' },
    6:{ nw_cert_date:'02/09/2026', ca_firm:'M/s Sharma & Associates', existing_pg:'None', biz_model:'Marketplace: buyers pay us over UPI, we settle to sellers T+1 minus our fee.' }
  }[n];
  if(!sample) return;
  Object.keys(sample).forEach(k => { if(!String(val(k)).trim() || UI.errors[k]) S.kyb.values[k] = sample[k]; });
  UI.errors={}; render(true); toast('Sample details filled for this step');
}
function attachSamples(){
  const co = (val('co_name')||S.user.company).replace(/[^A-Za-z0-9]+/g,'');
  DOCS.forEach(d => { if(d.req(svcs()) && !S.kyb.docs[d.id]) S.kyb.docs[d.id] = { name: d.id.toUpperCase()+'_'+co+'.pdf', size: (0.4+Math.random()*1.6).toFixed(1)+' MB', sample:true }; });
  UI.errors={}; render(true); toast('Sample documents attached');
}
function setDoc(id, file){
  if(!file) return;
  if(file.size > 10*1024*1024){ toast(file.name+' is over 10 MB. Compress it and try again.'); return; }
  if(!/\.(pdf|jpe?g|png)$/i.test(file.name)){ toast('Use a PDF, JPG or PNG file.'); return; }
  const kb = file.size/1024;
  S.kyb.docs[id] = { name:file.name, size: kb > 1024 ? (kb/1024).toFixed(1)+' MB' : Math.max(1,Math.round(kb))+' KB' };
  delete UI.errors['doc_'+id]; render(true); toast(file.name+' uploaded');
}

/* ───────────── Events ───────────── */
document.addEventListener('click', e => {
  const t = e.target.closest('[data-act]');
  if(UI.menu && !e.target.closest('.d-tr')){ UI.menu=false; if(!t) return render(true); }
  if(UI.tt && !e.target.closest('.tt') && !(t && t.dataset.act==='tt')){ UI.tt=null; if(!t) return render(true); }
  if(!t) return;
  const a = t.dataset.act; const d = t.dataset;
  switch(a){
    case 'w-home': if(S.screen==='dash') return go('home'); return go('home');
    case 'w-home-keep': UI.demo=false; return go('home');
    case 'w-signup': UI.demo=false; if(S.user && S.session) return go('dash'); if(d.pre){ S.preselect=[d.pre]; UI.draft=null; } else if(!UI.draft) S.preselect=[]; UI.signupErr={}; return go('signup');
    case 'w-login': UI.loginErr=''; return go('login');
    case 'w-scroll': { const el = document.getElementById(d.to); if(el) el.scrollIntoView({behavior:'smooth'}); return; }
    case 'go-dash': UI.demo=false; if(!S.user) return go('signup'); S.session=true; return go('dash');
    case 'chip': { const dr=UI.draft; const i=dr.products.indexOf(d.id); if(i>=0) dr.products.splice(i,1); else dr.products.push(d.id); delete UI.signupErr.products; return render(true); }
    case 'toggle-pass': UI.showPass=!UI.showPass; return render(true);
    case 'sso': toast('Google Workspace sign-in isn\'t wired up in this demo. Use your business email.'); return;
    case 'forgot': toast(S.user ? 'In the product, this sends a reset link to '+S.user.email+'.' : 'Create an account first.'); return;
    case 'fill-signup': UI.draft = Object.assign(UI.draft||{}, { first:'Arun', last:'Sharma', cc:'+91', phone:'9876543210', email:'arun@acmefinserv.com', company:'Acme Finserv', password:'decentro2026', terms:true }); if(!UI.draft.products.length) UI.draft.products=['payments','kyc']; UI.signupErr={}; return render(true);
    case 'nav': UI.modal=null; return nav(d.page);
    case 'env': if(d.env==='live' && !approved()){ UI.modal='golive'; return render(true); } S.env=d.env; S.page='home'; UI.menu=false; render(); toast(d.env==='live'?'Switched to Live':'Switched to Sandbox'); return;
    case 'menu': UI.menu=!UI.menu; return render(true);
    case 'notif': toast(S.kyb.status==='changes'?'Compliance asked for a change on your application.':approved()?'Your live account is active.':'No new notifications'); return;
    case 'docs': toast('API docs open in a new tab in the product.'); return;
    case 'logout': S.session=false; S.env='sandbox'; UI.menu=false; UI.chat.open=false; go('home'); toast('Logged out'); return;
    case 'reveal': UI.reveal[d.id]=!UI.reveal[d.id]; return render(true);
    case 'copy': copyText(d.val, d.label); if(d.label==='client_secret' || d.label==='client_id'){ if(!S.checklist.keys){ S.checklist.keys=true; render(true); } } return;
    case 'rotate': S.keys.secret='sbx_'+rand(28); UI.reveal.sbx=true; render(true); toast('Sandbox secret rotated. Update it in your test environment.'); return;
    case 'test-call': {
      const ref = 'DEC'+rand(10,'0123456789ABCDEF');
      UI.testOut = '<span class="c">$ curl -X POST https://in.staging.decentro.tech/[product-endpoint] \\\n    -H "client_id: '+esc(S.keys.id)+'" -H "client_secret: ••••"</span>\n\n{\n  <span class="s">"status"</span>: <span class="s">"SUCCESS"</span>,\n  <span class="s">"decentroTxnId"</span>: <span class="s">"'+ref+'"</span>,\n  <span class="s">"responseCode"</span>: <span class="n">"S00000"</span>,\n  <span class="s">"message"</span>: <span class="s">"Request processed in Sandbox"</span>\n}';
      S.checklist.call=true; S.checklist.keys=true; render(true); toast('Test request succeeded'); return;
    }
    case 'test-prod': {
      const id = d.id; S.tests[id] = S.tests[id] || [];
      const amt = id==='kyc' ? '—' : '₹ '+(Math.floor(Math.random()*90+10)*100).toLocaleString('en-IN');
      S.tests[id].push({ ref:'DEC'+rand(10,'0123456789ABCDEF'), amt:amt, ok:Math.random()>.25, at:new Date().toLocaleTimeString('en-IN',{hour:'2-digit',minute:'2-digit'}), env:S.env });
      if(S.env==='sandbox'){ S.checklist.call=true; S.checklist.keys=true; }
      render(true); toast(S.env==='live'?'Created in Live':'Test request created'); return;
    }
    case 'open-agent': UI.modal='agent'; return render(true);
    case 'agent-send': S.agentRequested=true; UI.modal=null; render(true); toast('Request sent. Your account manager will assign an agent.'); return;
    case 'template': UI.modal='template'; return render(true);
    case 'copy-template': { const pre = document.querySelector('.mod pre'); copyText(pre ? pre.textContent : '', 'Template'); return; }
    case 'modal-close': UI.modal=null; return render(true);
    case 'modal-bg': if(e.target===t){ UI.modal=null; render(true); } return;
    case 'modal-go': UI.modal=null; return nav(d.page);
    case 'svc': { const v = S.kyb.values; v.services = v.services||[]; const i=v.services.indexOf(d.id); if(i>=0) v.services.splice(i,1); else v.services.push(d.id); delete S.kyb.src.services; delete UI.errors.services; S.products = Array.from(new Set(S.products.concat(v.services))); return render(true); }
    case 'step-go': { const n=+d.step; if(stepSkipped(n)) return; return setStep(n); }
    case 'step-next': return stepNext();
    case 'step-prev': return setStep(prevStepNum(S.kyb.step));
    case 'save-exit': nav('home'); toast('Progress saved. Continue anytime from Home.'); return;
    case 'fill-sample': return fillSample();
    case 'sample-docs': return attachSamples();
    case 'fetch-mca': return fetchMCA();
    case 'rm-doc': delete S.kyb.docs[d.id]; return render(true);
    case 'declare': S.kyb.declared = t.checked; delete UI.errors.declare; save(); return;
    case 'submit-kyb': return submitKyb();
    case 'tt': UI.tt = UI.tt===d.k ? null : d.k; return render(true);
    case 'tt-close': UI.tt=null; return render(true);
    case 'ask-ai': { const f = FIELDS[d.k]; UI.tt=null; UI.chat = { open:true, field:f.l, expl:f.expl, msgs:[{ r:'a', t:'I can help with **'+f.l+'**. Ask anything, or pick a question.' }] }; render(true); const i=$('#cb-in'); if(i) i.focus(); return; }
    case 'open-chat': UI.chat = { open:true, field:'', expl:'', msgs:[{ r:'a', t:'Hi '+(S.user?S.user.first:'')+'. Ask about any field, document or step, or pick a question below.' }] }; renderChat(); { const i=$('#cb-in'); if(i) i.focus(); } return;
    case 'close-chat': UI.chat.open=false; return renderChat();
    case 'ai-q': return askAI(d.q);
    case 'demo': UI.demo=!UI.demo; return renderDemo();
    case 'demo-approve': S.kyb.status='approved'; S.liveKeys={ id: slug(S.user.company)+'_live', secret:'live_'+rand(32) }; UI.demo=false; render(true); toast('Approved. The Live switch is now unlocked.'); return;
    case 'demo-changes': S.kyb.status='changes'; S.kyb.note='The board resolution must be signed by at least two directors. Upload a signed copy.'; delete S.kyb.docs.board_res; S.kyb.done = S.kyb.done.filter(x=>x!==7 && x!==8); S.kyb.step=7; UI.demo=false; render(true); toast('Compliance requested a change'); return;
    case 'demo-reset': try{ localStorage.removeItem(KEY); }catch(err){} S = fresh(); Object.assign(UI, { errors:{}, tt:null, menu:false, modal:null, demo:false, reveal:{}, chat:{ open:false, field:'', expl:'', msgs:[] }, signupErr:{}, loginErr:'', draft:null, login:null, testOut:null }); render(); toast('Demo reset'); return;
  }
});
document.addEventListener('input', e => {
  const t = e.target;
  if(t.dataset.d && UI.draft){ UI.draft[t.dataset.d] = t.type==='checkbox' ? t.checked : t.value; if(UI.signupErr[t.dataset.d]){ t.classList.remove('bad'); } return; }
  if(t.dataset.l && UI.login){ UI.login[t.dataset.l] = t.value; return; }
  if(t.dataset.k){ S.kyb.values[t.dataset.k] = t.value; if(S.kyb.src[t.dataset.k]==='SU' || S.kyb.src[t.dataset.k]==='MCA'){ /* keep source chip until changed */ } if(UI.errors[t.dataset.k]){ t.classList.remove('bad'); } if(S.kyb.status==='not_started') S.kyb.status='in_progress'; save(); }
});
document.addEventListener('change', e => {
  const t = e.target;
  if(t.dataset.d && UI.draft){ UI.draft[t.dataset.d] = t.type==='checkbox' ? t.checked : t.value; return; }
  if(t.dataset.k){ S.kyb.values[t.dataset.k] = t.value; save(); return; }
  if(t.dataset.doc && t.files && t.files[0]) setDoc(t.dataset.doc, t.files[0]);
});
document.addEventListener('submit', e => {
  e.preventDefault();
  const id = e.target.id;
  if(id==='signup-form') return submitSignup();
  if(id==='login-form') return submitLogin();
  if(id==='cb-form'){ const i=$('#cb-in'); const q=i.value.trim(); if(q) askAI(q); return; }
  if(id==='hook-form'){ const v = $('#hook-url').value.trim(); if(!/^https:\/\/[^\s.]+\.[^\s]+/.test(v)){ UI.hookErr='Enter an HTTPS URL, like https://api.yourcompany.com/callback.'; return render(true); } UI.hookErr=null; S.webhook=v; S.checklist.webhook=true; render(true); toast('Webhook saved'); return; }
  if(id==='invite-form'){ const v=$('#inv-email').value.trim(); if(!VALID.email[0].test(v)){ UI.invErr='Enter a valid email address.'; return render(true); } UI.invErr=null; S.invites.push({ email:v, role:$('#inv-role').value }); S.checklist.team=true; render(true); toast('Invite sent to '+v); return; }
});
['dragover','dragleave','drop'].forEach(ev => document.addEventListener(ev, e => {
  const z = e.target.closest && e.target.closest('[data-drop]'); if(!z) return;
  e.preventDefault();
  if(ev==='dragover') z.classList.add('drag');
  else if(ev==='dragleave') z.classList.remove('drag');
  else { z.classList.remove('drag'); if(e.dataTransfer.files[0]) setDoc(z.dataset.drop, e.dataTransfer.files[0]); }
}));
document.addEventListener('keydown', e => { if(e.key==='Escape'){ if(UI.modal){ UI.modal=null; render(true); } else if(UI.tt){ UI.tt=null; render(true); } else if(UI.menu){ UI.menu=false; render(true); } } });

if(S.screen==='dash' && (!S.user || !S.session)) S.screen='home';
render();
})();
</script>
